[project]
name = "depouille"
version = "0.1.0"
description = "Outil interne de dépouillement de procédure pénale (usage local, non distribué)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic>=0.34",
    "rapidfuzz>=3.9",
    "tomli>=2.0; python_version < '3.11'",
    "Pillow>=10.3",
    "ocrmypdf>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "reportlab>=4.2",  # génération du jeu d'essai uniquement, jamais utilisé par le pipeline
]

[project.scripts]
depouille = "depouille.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
